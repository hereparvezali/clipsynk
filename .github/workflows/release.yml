name: Release Multi-Platform Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 1. Linux Packages (Debian .deb, Fedora .rpm, and Universal .tar.gz)
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev rpm

      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release

      - name: Build Debian .deb package
        run: cargo deb

      - name: Build Fedora/RHEL .rpm package
        run: cargo generate-rpm

      - name: Create Universal Tarball
        run: tar -czvf target/release/clipsynk-linux-x86_64.tar.gz -C target/release clipsynk

      - name: Upload Linux Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/release/clipsynk-linux-x86_64.tar.gz

  # 2. Arch Linux Package (.pkg.tar.zst)
  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Arch build environment
        run: |
          pacman -Syu --noconfirm base-devel rust git wayland
          useradd -m builder && echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Build Arch Linux package
        run: |
          su builder -c "cd distribution/arch && makepkg -s --noconfirm"

      - name: Upload Arch Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: distribution/arch/*.pkg.tar.zst

  # 3. Windows Packages (.exe Installer & portable .zip)
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Build Inno Setup Installer
        uses: Minithra/innosetup-action@v1.2.2
        with:
          filepath: distribution/windows/installer.iss

      - name: Create Portable Zip
        run: Compress-Archive -Path target\release\clipsynk.exe -DestinationPath target\release\clipsynk-windows-x86_64.zip

      - name: Upload Windows Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/ClipSynk-Setup-*.exe
            target/release/clipsynk-windows-x86_64.zip

  # 4. Android APK Package (.apk)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Prepare APK Asset
        run: |
          mkdir -p target/android
          cp android/app/build/outputs/apk/debug/app-debug.apk target/android/clipsynk-android.apk

      - name: Upload Android APK
        uses: softprops/action-gh-release@v2
        with:
          files: target/android/clipsynk-android.apk
