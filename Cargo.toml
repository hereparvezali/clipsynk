[workspace]
members = [
    "crates/clipsynk-core",
    "crates/clipsynk-desktop",
    "crates/clipsynk-ffi",
]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/hereparvezali/clipsynk"
description = "Cross-device real-time clipboard sync over your local network"

[workspace.dependencies]
local-ip-address = "0.6.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
uniffi = { version = "0.28", features = ["cli"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
xxhash-rust = { version = "0.8.18", features = ["const_xxh3"] }
