[package]
name = "clipsynk"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-clipboard-listener = "0.6.1"
wl-clipboard-rs = "0.9.3"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-master = "4.0.0"
# windows = { version = "0.62.2", features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }
