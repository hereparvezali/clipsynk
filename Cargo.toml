[package]
name = "clipsynk"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Cross device real-time light-weight clipboard sync over your local network"
repository = "https://github.com/hereparvezali/clipsynk"
readme = "readme.md"
keywords = ["clipboard", "sync", "device", "realtime", "cross"]
categories = ["network-programming", "accessibility", "os", "command-line-utilities"]

[dependencies]
local-ip-address = "0.6.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
xxhash-rust = { version = "0.8.18", features = ["const_xxh3"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-clipboard-listener = "0.6.1"
wl-clipboard-rs = "0.9.3"
clipboard-master = "4.0.0"
arboard = "3.6.1"

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-master = "4.0.0"
clipboard-win = "5.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
clipboard-master = "4.0.0"
arboard = "3.6.1"
